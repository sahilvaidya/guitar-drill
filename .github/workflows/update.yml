name: EAS Update

on:
  push:
    branches: [main]

jobs:
  update:
    name: OTA update to production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: eas update --branch production --non-interactive --message "$(printf '%s' "$COMMIT_MSG" | head -1)"
